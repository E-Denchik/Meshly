name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Builds and tests the app against the real c-toxcore/ToxAV engine (see README.md's
# "Building" section). :app depends on :daemon-tox, which needs both the
# native/upstream/c-toxcore submodule (including its own nested third_party/cmp
# submodule - "submodules: recursive" below covers that) and a cross-compiled
# libsodium/opus/libvpx tree under daemon-tox/deps/arm64-v8a/lib/*.a - those .a files
# are gitignored build output, so this workflow reproduces them via
# daemon-tox/scripts/build-native-deps.sh, caching the result keyed on that script's
# contents so most runs don't pay the native cross-compile cost again.
env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool pkg-config

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ env.NDK_VERSION }}"

      - name: Cache native dependency build (libsodium/opus/libvpx)
        id: native-deps-cache
        uses: actions/cache@v4
        with:
          path: |
            daemon-tox/deps/arm64-v8a/lib/libsodium.a
            daemon-tox/deps/arm64-v8a/lib/libopus.a
            daemon-tox/deps/arm64-v8a/lib/libvpx.a
          key: native-deps-arm64-v8a-ndk${{ env.NDK_VERSION }}-${{ hashFiles('daemon-tox/scripts/build-native-deps.sh') }}

      - name: Build native dependencies (libsodium/opus/libvpx)
        if: steps.native-deps-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./daemon-tox/scripts/build-native-deps.sh

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meshly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
